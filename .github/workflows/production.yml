name: Kitsu Production Release

on:
  push:
    tags:
      - 'v*'
 
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: kitsu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: kitsu.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            binary_name: kitsu

    steps:
    - uses: actions/checkout@v4

    - name: Install Dependencies (Linux)
      if: runner.os == 'Linux'
      run: |
        sudo apt-get update
        sudo apt-get install -y libssh2-1-dev libssl-dev pkg-config

    - name: Install Dependencies (macOS)
      if: runner.os == 'macOS'
      run: |
        brew update
        brew install libssh2 openssl pkg-config

    - name: Setup Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: ${{ matrix.target }}

    - name: Rust Cache
      uses: Swatinem/rust-cache@v2
      with:
        key: ${{ matrix.target }}

    - name: Build Release Binary
      run: cargo build --release --bin kitsu --target ${{ matrix.target }}

    - name: Rename binary (Unix)
      if: runner.os != 'Windows'
      run: |
        if [ "kitsu" != "${{ matrix.binary_name }}" ]; then
          mv target/${{ matrix.target }}/release/kitsu target/${{ matrix.target }}/release/${{ matrix.binary_name }}
        fi

    - name: Archive Artifacts (Unix)
      if: runner.os != 'Windows'
      run: |
        cd target/${{ matrix.target }}/release
        tar -czf ../../../kitsu-${{ matrix.target }}.tar.gz ${{ matrix.binary_name }}

    - name: Archive Artifacts (Windows)
      if: runner.os == 'Windows'
      run: |
        cd target/${{ matrix.target }}/release
        7z a ../../../kitsu-${{ matrix.target }}.zip ${{ matrix.binary_name }}

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: kitsu-${{ matrix.target }}
        path: kitsu-${{ matrix.target }}.*

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        pattern: kitsu-*
        merge-multiple: true

    - name: Generate Checksums
      run: |
        cd artifacts
        sha256sum * > SHA256SUMS.txt
        ls -la

    - name: Extract Cargo Version and Release Info
      id: release_info
      run: |
        VERSION=$(sed -nE 's/^[[:space:]]*version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' Cargo.toml | head -n 1)
        if [ -z "$VERSION" ]; then
          echo "::error::Could not extract version from Cargo.toml"
          exit 1
        fi

        if [[ "$VERSION" =~ ^v ]]; then
          TAG="$VERSION"
        else
          TAG="v$VERSION"
        fi

        echo "tag_name=$TAG" >> $GITHUB_OUTPUT
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Detected version: $VERSION -> tag: $TAG"

        if [[ "$VERSION" == *"-"* ]] || [[ "$VERSION" == *"alpha"* ]] || [[ "$VERSION" == *"beta"* ]] || [[ "$VERSION" == *"rc"* ]] || [[ "$VERSION" == *"dev"* ]]; then
          echo "is_prerelease=true" >> $GITHUB_OUTPUT
          echo "make_latest=false" >> $GITHUB_OUTPUT
        else
          echo "is_prerelease=false" >> $GITHUB_OUTPUT
          echo "make_latest=true" >> $GITHUB_OUTPUT
        fi

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.release_info.outputs.tag_name }}
        name: Kitsu ${{ steps.release_info.outputs.tag_name }}
        files: artifacts/*
        generate_release_notes: true
        draft: false
        prerelease: ${{ steps.release_info.outputs.is_prerelease == 'true' }}
        make_latest: ${{ steps.release_info.outputs.make_latest }}
